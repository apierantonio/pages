    row.appendChild(w); row.appendChild(seg); group.list.appendChild(row);
    rows.push({ s: s, row: row, seg: seg });
  });
  groups.forEach(function (g) {
    if (g.slots.length > 1) {
      var all = el("button", "link", T.all_yes); all.type = "button";
      all.addEventListener("click", function () { allYes(g.slots); }); g.name.appendChild(all);
    }
    times.appendChild(g.el);
  });
  root.appendChild(times);

  // Step 2: who is answering.
  var who = el("section", "card"); who.setAttribute("aria-labelledby", "s2");
  who.appendChild(head(T.step2, null, "s2"));
  var fields = el("div", "fields"); who.appendChild(fields);
  function field(id, label, kind, value, wide) {
    var box = el("div", wide ? "wide" : null), l = el("label", null, label); l.htmlFor = id; box.appendChild(l);
    var f = document.createElement(kind === "area" ? "textarea" : "input"); f.id = id;
    if (kind !== "area") f.type = kind; f.value = value || ""; box.appendChild(f); fields.appendChild(box); return f;
  }
  var name = field("n", T.name, "text", mine.name), email = field("e", T.email, "email", mine.email),
      comment = field("c", T.comment, "area", mine.comment, true);
  var eh = el("p", "hint", T.email_hint); eh.id = "eh"; email.parentNode.appendChild(eh); email.setAttribute("aria-describedby", "eh");
  name.maxLength = 100; name.autocomplete = "name"; email.maxLength = 200; email.autocomplete = "email"; comment.maxLength = 500;
  root.appendChild(who);

  var votesCard = el("section", "card"); votesCard.hidden = true; root.appendChild(votesCard);

  // The dock: how many times are answered, the outcome, the button.
  var dock = el("div", "dock"), din = el("div", "dock-in"), dt = el("div", "dock-text");
  var prog = el("div", "progress"), st = el("p", "status"); st.setAttribute("role", "status");
  dt.appendChild(prog); dt.appendChild(st);
  var send = el("button", "send", mine.token ? T.update : T.send); send.type = "button";
  din.appendChild(dt); din.appendChild(send); dock.appendChild(din); root.appendChild(dock);

  function paint() {
    rows.forEach(function (r) {
      var a = answers[r.s.id];
      if (a) r.row.setAttribute("data-a", a); else r.row.removeAttribute("data-a");
      Array.prototype.forEach.call(r.seg.children, function (x) { x.setAttribute("aria-pressed", a && x.classList.contains(a) ? "true" : "false"); });
    });
    var n = Object.keys(answers).length;
    prog.textContent = !n ? T.progress_none : (n === 1 ? T.progress1 : T.progress).replace("{n}", n).replace("{m}", D.slots.length);
  }
  paint();

  function post(body) {
    return fetch(EP, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }
  send.addEventListener("click", function () {
    st.className = "status err";
    if (!Object.keys(answers).length) { st.textContent = T.need_answer; times.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (!name.value.trim()) { st.textContent = T.need_name; name.focus(); return; }
    var t = token();
    send.disabled = true; st.className = "status"; st.textContent = T.sending;
    post({ action: "vote", poll: D.id, token: t, name: name.value.trim().slice(0, 100), email: email.value.trim().slice(0, 200),
           answers: JSON.stringify(answers), comment: comment.value.trim().slice(0, 500) })
      .then(function () {
        mine = { token: t, name: name.value.trim(), email: email.value.trim(), comment: comment.value.trim(), answers: answers };
        save(mine); st.className = "status ok"; st.textContent = T.sent; send.textContent = T.update; refresh();
      })
      .catch(function () { st.className = "status err"; st.textContent = T.failed; })
      .then(function () { send.disabled = false; });
  });
  function refresh() {
    if (!D.show_votes) return;
    votesCard.hidden = false; votesCard.innerHTML = "";
    votesCard.appendChild(head(T.answers));
    var box = el("div", "votes"), wait = el("p", "note", T.loading); box.appendChild(wait); votesCard.appendChild(box);
    post({ action: "votes", poll: D.id }).then(function (r) {
      var by = {};
      (r.votes || []).forEach(function (v) { if (!by[v.token] || (v.at || "") >= (by[v.token].at || "")) by[v.token] = v; });
      var vs = Object.keys(by).map(function (k) { var v = by[k], a = v.answers;
        if (typeof a === "string") { try { a = JSON.parse(a); } catch (e) { a = {}; } }
        return { token: v.token, name: v.name || "?", answers: a || {}, comment: v.comment || "", at: v.at || "" }; });
      vs.sort(function (a, b) { return a.at < b.at ? -1 : 1; });
      wait.remove();
      var tot = {}; D.slots.forEach(function (s) { tot[s.id] = { yes: 0, maybe: 0, no: 0 }; });
      vs.forEach(function (v) { Object.keys(v.answers).forEach(function (k) { if (tot[k] && tot[k][v.answers[k]] != null) tot[k][v.answers[k]]++; }); });
      D.slots.forEach(function (s) {
        var t = tallies[s.id]; t.innerHTML = "";
        if (!vs.length) return;
        var bar = el("span", "bar"), y = el("i", "y"), m = el("i", "m");
        y.style.width = (100 * tot[s.id].yes / vs.length) + "%"; m.style.width = (100 * tot[s.id].maybe / vs.length) + "%";
        bar.appendChild(y); bar.appendChild(m); bar.setAttribute("aria-hidden", "true"); t.appendChild(bar);
        t.appendChild(el("span", null, T.yes + " " + tot[s.id].yes + " · " + T.maybe + " " + tot[s.id].maybe + " · " + T.no + " " + tot[s.id].no));
      });
      if (!vs.length) { box.appendChild(el("p", "note", T.none)); return; }
      var wrap = el("div", "matrix"), tb = el("table"), hr = el("tr"); hr.appendChild(el("th"));
      D.slots.forEach(function (s) { var th = el("th", null, fmt(s.start, HOME, { weekday: "short", day: "numeric", month: "short" })); th.appendChild(el("br")); th.appendChild(document.createTextNode(span(s))); hr.appendChild(th); });
      hr.appendChild(el("th")); tb.appendChild(hr);
      var mark = { yes: ["y", "✓"], maybe: ["m", "~"], no: ["n", "✗"] };
      vs.forEach(function (v) {
        var tr = el("tr", v.token === mine.token ? "me" : null);
        tr.appendChild(el("td", null, v.name + (v.token === mine.token ? " (" + T.you + ")" : "")));
        D.slots.forEach(function (s) { var a = mark[v.answers[s.id]]; var td = el("td", a ? a[0] : null, a ? a[1] : ""); if (a) td.title = T[v.answers[s.id]]; tr.appendChild(td); });
        tr.appendChild(el("td", "cm", v.comment)); tb.appendChild(tr);
      });
      var ft = el("tr"); ft.appendChild(el("td", null, T.total));
      D.slots.forEach(function (s) { ft.appendChild(el("td", null, tot[s.id].yes + " / " + tot[s.id].maybe)); }); ft.appendChild(el("td")); tb.appendChild(ft);
      wrap.appendChild(tb); box.appendChild(wrap);
    }).catch(function () { wait.textContent = ""; });
  }
  refresh();
})();
</script></body></html>
